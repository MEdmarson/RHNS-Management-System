<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password</title>
  <link rel="icon" href="rnshs-logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-left">
    <img src="rnshs-logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/220?text=RNHS+Logo'">
    <h1>Welcome, ${user.name}!</h1>
    <p>For security reasons, please set a new password before continuing.</p>
  </div>

  <div class="login-right">
    <div class="form-container">
      <h2 style="margin-bottom: 20px; color: var(--primary);">Change Password</h2>
      <form id="changePasswordForm">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password">
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="Confirm new password">
        </div>
        <button type="submit" class="btn-submit">Save & Continue</button>
        <div id="msg" class="error-msg"></div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Ensure they are logged in before they can see this page
    const user = getUser();
    if (!user.role) {
      window.location = 'index.html';
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pass = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('msg');

      // 1. Check if passwords match
      if (pass !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.style.color = 'var(--danger)';
        return;
      }

      // 2. Prevent reusing LRN (For Students)
      if (user.lrn && pass.toLowerCase() === user.lrn.toLowerCase()) {
        msg.textContent = 'You cannot use your LRN as your new password.';
        msg.style.color = 'var(--danger)';
        return;
      }

      // 3. Prevent reusing Email (For Teachers/Admins)
      if (user.email && pass.toLowerCase() === user.email.toLowerCase()) {
        msg.textContent = 'You cannot use your Email as your new password.';
        msg.style.color = 'var(--danger)';
        return;
      }

      msg.textContent = 'Saving...';
      msg.style.color = 'var(--muted)';

      try {
        // Send the request to the backend
        await apiFetch('/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ newPassword: pass })
        });
        
        msg.textContent = '✅ Password changed! Redirecting...';
        msg.style.color = 'var(--success)';
        
        // Redirect based on their role (student, teacher, admin)
        setTimeout(() => {
          window.location = `${user.role}.html`;
        }, 1500);

      } catch (err) {
        msg.textContent = '❌ ' + err.message;
        msg.style.color = 'var(--danger)';
      }
    });
  </script>
</body>
</html>

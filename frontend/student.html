<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Portal — EduTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🎓 EduTrack</div>
    <div class="nav-item active" onclick="showView('dashboard', this)">📊 Dashboard</div>
    <div class="nav-item" onclick="showView('attendance', this)">📅 Attendance</div>
    <div class="nav-item" onclick="showView('notifs', this)">🔔 Notifications</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2>Student Portal</h2>
      <div class="user-chip" id="userChip"></div>
    </div>

    <div class="view" id="view-dashboard">
      <div class="stats-grid" id="stats"></div>
      <div class="card">
        <h3>📖 My Subjects</h3>
        <table>
          <thead><tr><th>Subject</th><th>Teacher</th><th>Grade</th><th>Status</th></tr></thead>
          <tbody id="subjectsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="view" id="view-attendance" style="display:none">
      <div class="stats-grid" id="attStats"></div>
    </div>

    <div class="view" id="view-notifs" style="display:none">
      <div class="card"><h3>🔔 Notifications</h3><div id="notifsList"></div></div>
    </div>
  </main>
  <button class="logout-btn" onclick="logout()">↩ Logout</button>
</div>

<script src="js/api.js"></script>
<script src="js/student.js"></script>
</body>
</html>

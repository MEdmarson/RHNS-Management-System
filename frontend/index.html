<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosales National High School — EduTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    body.login-page {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      background: #0000FF;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* LEFT SIDE: Branding */
    .login-left {
      flex: 1;
      background: linear-gradient(135deg, #FF0000 0%, #7c3aed 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 40px;
      text-align: center;
    }
    .login-left img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin-bottom: 30px;
      background: white;
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .login-left h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
      font-weight: 700;
    }
    .login-left p {
      font-size: 16px;
      opacity: 0.9;
      max-width: 400px;
      line-height: 1.5;
    }

    /* RIGHT SIDE: Forms */
    .login-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      padding: 40px;
    }
    .form-container {
      width: 100%;
      max-width: 400px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s;
    }
    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      margin-bottom: -2px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: var(--primary-dark);
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    /* Form Visibility */
    .form-section {
      display: none;
    }
    .form-section.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      body.login-page {
        flex-direction: column;
      }
      .login-left {
        padding: 30px;
      }
      .login-left img {
        width: 120px;
        height: 120px;
        margin-bottom: 15px;
      }
      .login-left h1 { font-size: 24px; }
      .login-right { padding: 20px; }
    }
  </style>
</head>
<body class="login-page">

  <!-- LEFT SIDE: BRANDING & LOGO -->
  <div class="login-left">
    <!-- Make sure to save the logo image in your frontend folder as "rnshs-logo.png" -->
    <img src="rnshs-logo.png" alt="Rosales National High School Logo" onerror="this.src='https://via.placeholder.com/220?text=RNHS+Logo'">
    <h1>EduTrack</h1>
    <p>Rosales National High School<br>Web-Based School Management System</p>
  </div>

  <!-- RIGHT SIDE: LOGIN & SIGNUP -->
  <div class="login-right">
    <div class="form-container">
      
      <!-- TABS -->
      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')" id="tab-login">Log In</div>
        <div class="tab" onclick="switchTab('signup')" id="tab-signup">Sign Up</div>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-section active" id="section-login">
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-submit">Log In</button>
          <div id="loginError" class="error-msg"></div>
        </form>
        <div style="margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center;">
          <b>Demo Accounts (password: password123)</b><br>
          admin@school.edu · teacher@school.edu · student@school.edu
        </div>
      </div>

      <!-- SIGN UP FORM -->
      <div class="form-section" id="section-signup">
        <form id="signupForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="e.g. Juan Dela Cruz" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label>LRN (Learner Reference Number)</label>
            <input type="text" id="regLRN" placeholder="12-digit LRN" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password" required>
          </div>
          <button type="submit" class="btn-submit" style="background: var(--success);">Create Student Account</button>
          <div id="signupError" class="error-msg"></div>
        </form>
      </div>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/api.js"></script>
  <script>
    // --- TAB SWITCHING LOGIC ---
    function switchTab(tab) {
      // Update Tab UI
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-signup').classList.remove('active');
      document.getElementById(`tab-${tab}`).classList.add('active');

      // Update Form Visibility
      document.getElementById('section-login').classList.remove('active');
      document.getElementById('section-signup').classList.remove('active');
      document.getElementById(`section-${tab}`).classList.add('active');
    }

    // --- LOGIN LOGIC ---
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      
      errorDiv.textContent = 'Logging in...';
      errorDiv.style.color = 'var(--muted)';

      try {
        await login(email, password);
      } catch (err) {
        errorDiv.textContent = err.message || 'Invalid credentials';
        errorDiv.style.color = 'var(--danger)';
      }
    });

    // --- SIGN UP LOGIC (Prototype UI) ---
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errorDiv = document.getElementById('signupError');
      
      // In a real app, you would call an API here (e.g., POST /api/auth/register)
      // For this prototype, we will simulate a successful registration.
      
      errorDiv.textContent = 'Creating account...';
      errorDiv.style.color = 'var(--muted)';
      
      setTimeout(() => {
        errorDiv.textContent = 'Account created successfully! You can now log in.';
        errorDiv.style.color = 'var(--success)';
        
        // Pre-fill login email for convenience
        document.getElementById('loginEmail').value = document.getElementById('regEmail').value;
        
        setTimeout(() => switchTab('login'), 1500);
      }, 1000);
    });
  </script>
</body>
</html>

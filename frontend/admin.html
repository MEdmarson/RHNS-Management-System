<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — EduTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div style="font-weight: 600; color: var(--primary);">Loading...</div></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">🎓 Admin</div>
    <div class="nav-item active" onclick="showView('users', this)">👥 Manage Users</div>
    <div class="nav-item" onclick="showView('subjects', this)">📚 Manage Subjects</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Manage Users</h2>
      <div class="user-chip" id="userChip"></div>
    </div>

    <!-- MANAGE USERS VIEW -->
    <div class="view active" id="view-users">
      <div class="card" style="max-width: 600px; margin-bottom: 20px;">
        <h3>➕ Add New User</h3>
        <form id="addUserForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="userFullName" required placeholder="e.g. Maria Santos">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="userEmail" required placeholder="email@school.edu">
            </div>
            <div class="form-group">
              <label>Role</label>
              <select id="userRole" onchange="toggleStudentFields()">
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
              </select>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="userPassword" required placeholder="Set a password">
            </div>
          </div>

          <!-- Student Only Fields -->
          <div id="studentFields" style="display: none; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
            <div class="form-group">
              <label>LRN (12 digits)</label>
              <input type="text" id="studentLRN" placeholder="136501230000">
            </div>
            <div class="form-group">
              <label>Section</label>
              <select id="studentSection">
                <!-- Populated via JS -->
              </select>
            </div>
          </div>

          <button type="submit" class="btn" style="margin-top: 15px; width: 100%;">Create Account</button>
        </form>
        <div id="userMsg" class="error-msg" style="margin-top: 10px;"></div>
      </div>
    </div>

    <!-- MANAGE SUBJECTS VIEW -->
    <div class="view" id="view-subjects" style="display: none;">
      <div class="card" style="max-width: 600px; margin-bottom: 20px;">
        <h3>➕ Add New Subject</h3>
        <form id="addSubjectForm">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label>Subject Code</label>
              <input type="text" id="subjCode" required placeholder="e.g. MATH10">
            </div>
            <div class="form-group">
              <label>Subject Name</label>
              <input type="text" id="subjName" required placeholder="e.g. Mathematics 10">
            </div>
            <div class="form-group">
              <label>Assign to Teacher</label>
              <select id="subjTeacher"></select>
            </div>
            <div class="form-group">
              <label>Assign to Section</label>
              <select id="subjSection"></select>
            </div>
          </div>
          <button type="submit" class="btn" style="margin-top: 15px; width: 100%;">Create Subject</button>
        </form>
        <div id="subjMsg" class="error-msg" style="margin-top: 10px;"></div>
      </div>
    </div>

  </main>
  <button class="logout-btn" onclick="logout()">↩ Logout</button>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth('admin');
  document.getElementById('userChip').textContent = '🛡️ ' + getUser().name;

  function showView(name, el) {
    document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
    document.getElementById(`view-${name}`).style.display = 'block';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('pageTitle').textContent = name === 'users' ? 'Manage Users' : 'Manage Subjects';
  }

  function toggleStudentFields() {
    const role = document.getElementById('userRole').value;
    document.getElementById('studentFields').style.display = role === 'student' ? 'grid' : 'none';
  }

  // Load dropdowns when page loads
  async function loadDropdowns() {
    const teachers = await apiFetch('/admin/teachers');
    const sections = await apiFetch('/admin/sections');

    document.getElementById('subjTeacher').innerHTML = teachers.map(t => `<option value="${t.id}">${t.full_name}</option>`).join('');
    document.getElementById('subjSection').innerHTML = sections.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    document.getElementById('studentSection').innerHTML = sections.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  }

  // Handle Add User Form
  document.getElementById('addUserForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgDiv = document.getElementById('userMsg');
    msgDiv.textContent = 'Creating...';
    msgDiv.style.color = 'var(--muted)';

    const payload = {
      full_name: document.getElementById('userFullName').value,
      email: document.getElementById('userEmail').value,
      role: document.getElementById('userRole').value,
      password: document.getElementById('userPassword').value,
      lrn: document.getElementById('studentLRN').value,
      section_id: document.getElementById('studentSection').value
    };

    try {
      await apiFetch('/admin/users', { method: 'POST', body: JSON.stringify(payload) });
      msgDiv.textContent = '✅ User created successfully!';
      msgDiv.style.color = 'var(--success)';
      document.getElementById('addUserForm').reset();
      toggleStudentFields();
      loadDropdowns(); // Refresh teacher list if a teacher was added
    } catch (err) {
      msgDiv.textContent = '❌ ' + err.message;
      msgDiv.style.color = 'var(--danger)';
    }
  });

  // Handle Add Subject Form
  document.getElementById('addSubjectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msgDiv = document.getElementById('subjMsg');
    msgDiv.textContent = 'Creating...';
    msgDiv.style.color = 'var(--muted)';

    const payload = {
      code: document.getElementById('subjCode').value,
      name: document.getElementById('subjName').value,
      teacher_id: document.getElementById('subjTeacher').value,
      section_id: document.getElementById('subjSection').value
    };

    try {
      await apiFetch('/admin/subjects', { method: 'POST', body: JSON.stringify(payload) });
      msgDiv.textContent = '✅ Subject created and assigned!';
      msgDiv.style.color = 'var(--success)';
      document.getElementById('addSubjectForm').reset();
    } catch (err) {
      msgDiv.textContent = '❌ ' + err.message;
      msgDiv.style.color = 'var(--danger)';
    }
  });

  loadDropdowns();
</script>
</body>
</html>
